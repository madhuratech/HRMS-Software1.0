# ==============================================================================
# Nginx Configuration for Madhura HRMS Production
# Frontend: https://hrms.madhuratech.com
# Backend:  https://api.hrms.madhuratech.com (Port 3308)
# ==============================================================================

# 1. Frontend SPA (hrms.madhuratech.com)
server {
    listen 80;
    listen 443 ssl http2;
    server_name hrms.madhuratech.com;

    # Production frontend build directory
    root /home/madhuratech-hrms/htdocs/hrms.madhuratech.com/Hrms-Frontend/frontend/dist;
    index index.html;

    # SSL configuration (handled by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/hrms.madhuratech.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hrms.madhuratech.com/privkey.pem;

    # CRITICAL: React Router SPA Fallback
    # Prevents 404 on refreshing routes like /attendance/gps, /dashboard, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        types {
            application/javascript js mjs;
            text/css css;
        }
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 2. Backend API Reverse Proxy (api.hrms.madhuratech.com -> 127.0.0.1:3308)
server {
    listen 80;
    listen 443 ssl http2;
    server_name api.hrms.madhuratech.com;

    client_max_body_size 50M;

    # SSL configuration (handled by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/api.hrms.madhuratech.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.hrms.madhuratech.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3308;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Uploads static serving (if served directly by Nginx)
    location /uploads/ {
        alias /home/madhuratech-api-hrms/htdocs/api.hrms.madhuratech.com/Hrms-Backend/backend/uploads/;
        expires 30d;
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri @proxy_to_node;
    }

    location @proxy_to_node {
        proxy_pass http://127.0.0.1:3308;
    }
}
